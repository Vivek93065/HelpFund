<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register - HelpFund</title>
  
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">

  <style>
    .auth-wrapper {
      min-height: calc(100vh - 4.5rem - 6rem);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .auth-header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--color-text-main);
      margin-bottom: 0.35rem;
    }

    .auth-header p {
      font-size: 0.95rem;
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="/" class="brand-logo">
        <span class="brand-icon">H</span>
        <span>Help<span class="brand-highlight">Fund</span></span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="/" class="nav-link">Home</a></li>
          <li><a href="/explore.html" class="nav-link">Explore Causes</a></li>
        </ul>
      </nav>

      <div class="nav-actions" id="nav-actions">
        <a href="/" class="btn btn-secondary">Back to Home</a>
      </div>
    </div>
  </header>

  <!-- Main Auth Section -->
  <main class="auth-wrapper">
    <div class="card card-elevated auth-card">
      
      <div class="auth-header">
        <h1 id="auth-title">Welcome Back</h1>
        <p id="auth-subtitle">Sign in to manage your campaigns and donations</p>
      </div>

      <!-- Tab Switcher -->
      <div class="tab-group">
        <button type="button" class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
        <button type="button" class="tab-btn" id="tab-register" onclick="switchTab('register')">Create Account</button>
      </div>

      <!-- Dynamic Alert Container -->
      <div id="alert-box" style="display: none;"></div>

      <!-- Demo Accounts Quick Fill Box for Hackathon Judges -->
      <div style="background: var(--color-surface-hover); border: 1px dashed var(--color-border); border-radius: var(--radius-md); padding: 0.75rem 1rem; margin-bottom: 1.25rem; font-size: 0.82rem;">
        <div style="font-weight: 700; color: var(--color-text-main); margin-bottom: 0.35rem;">
          🧪 Hackathon Judge Quick Demo Sign-In:
        </div>
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
          <button type="button" class="btn btn-secondary btn-sm" style="font-size: 0.78rem; padding: 0.25rem 0.6rem;" onclick="quickFillLogin('maya.lin@helpfund.org', 'DemoPassword123!')">
            👨‍⚕️ Demo Creator (Dr. Maya Lin)
          </button>
        </div>
      </div>

      <!-- Sign In Form -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input 
            type="email" 
            id="login-email" 
            class="form-control" 
            placeholder="you@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input 
            type="password" 
            id="login-password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
          <span>Sign In</span>
        </button>
      </form>

      <!-- Registration Form -->
      <form id="register-form" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input 
            type="text" 
            id="reg-name" 
            class="form-control" 
            placeholder="Jane Doe" 
            required 
            minlength="2"
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input 
            type="email" 
            id="reg-email" 
            class="form-control" 
            placeholder="you@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input 
            type="password" 
            id="reg-password" 
            class="form-control" 
            placeholder="At least 8 chars, 1 letter, 1 number" 
            required 
            minlength="8"
            autocomplete="new-password"
          >
          <p class="form-hint">Must be at least 8 characters with at least one number.</p>
        </div>

        <!-- Role Selector -->
        <div class="form-group">
          <label class="form-label">I want to:</label>
          <div class="role-grid">
            <label class="role-card selected" id="role-creator-card" onclick="selectRole('creator')">
              <input type="radio" name="role" value="creator" checked>
              <div class="role-title">Raise Funds</div>
              <div class="role-desc">Start a campaign for a cause</div>
            </label>
            <label class="role-card" id="role-donor-card" onclick="selectRole('donor')">
              <input type="radio" name="role" value="donor">
              <div class="role-title">Donate / Back</div>
              <div class="role-desc">Support causes you love</div>
            </label>
          </div>
        </div>

        <button type="submit" id="reg-submit-btn" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
          <span>Create Account</span>
        </button>
      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 HelpFund. AI-Powered Crowdfunding Platform.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    let activeRole = 'creator';

    // Tab Switching Logic
    function switchTab(tab) {
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');
      const tabLogin = document.getElementById('tab-login');
      const tabReg = document.getElementById('tab-register');
      const title = document.getElementById('auth-title');
      const subtitle = document.getElementById('auth-subtitle');
      clearAlert();

      if (tab === 'register') {
        loginForm.style.display = 'none';
        regForm.style.display = 'block';
        tabLogin.classList.remove('active');
        tabReg.classList.add('active');
        title.textContent = 'Join HelpFund';
        subtitle.textContent = 'Create an account to start raising or donating funds';
      } else {
        loginForm.style.display = 'block';
        regForm.style.display = 'none';
        tabLogin.classList.add('active');
        tabReg.classList.remove('active');
        title.textContent = 'Welcome Back';
        subtitle.textContent = 'Sign in to manage your campaigns and donations';
      }
    }

    // Role Card Selection
    function selectRole(role) {
      activeRole = role;
      document.getElementById('role-creator-card').classList.toggle('selected', role === 'creator');
      document.getElementById('role-donor-card').classList.toggle('selected', role === 'donor');
    }

    // Alert Utilities
    function showAlert(message, type = 'error') {
      const box = document.getElementById('alert-box');
      box.className = `alert alert-${type}`;
      box.textContent = message;
      box.style.display = 'block';
    }

    function clearAlert() {
      const box = document.getElementById('alert-box');
      box.style.display = 'none';
      box.textContent = '';
    }

    function quickFillLogin(email, password) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
      switchTab('login');
      if (window.showToast) showToast(`Loaded credentials for ${email}`, 'info');
    }

    // Check URL query param for default tab (e.g. ?tab=register)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('tab') === 'register') {
      switchTab('register');
    }

    const requestedRedirect = urlParams.get('redirect') || '';
    const redirectTarget = /^\/(?![\/\\])/.test(requestedRedirect) ? requestedRedirect : '/dashboard.html';

    // Handle Login Submit
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-submit-btn');

      try {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Signing in...';

        await Auth.login(email, password);
        showAlert('Login successful! Redirecting...', 'success');
        if (window.showToast) showToast('Welcome back!', 'success');
        
        setTimeout(() => {
          window.location.href = redirectTarget;
        }, 700);
      } catch (err) {
        showAlert(err.message || 'Invalid email or password.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In</span>';
      }
    });

    // Handle Registration Submit
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      const full_name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const btn = document.getElementById('reg-submit-btn');

      try {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Creating Account...';

        await Auth.register({
          full_name,
          email,
          password,
          role: activeRole
        });

        showAlert('Account created successfully! Redirecting...', 'success');
        if (window.showToast) showToast('Account created successfully!', 'success');
        
        setTimeout(() => {
          window.location.href = redirectTarget;
        }, 700);
      } catch (err) {
        showAlert(err.message || 'Registration failed. Please check inputs.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Create Account</span>';
      }
    });
  </script>
</body>
</html>
